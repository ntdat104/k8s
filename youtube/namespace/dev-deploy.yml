apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: dev # Chỉ định namespace tại đây
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:latest